name: Lint, Test, and Build

on:
    push:
        branches:
            - master
            - dev

jobs:
    run-linters:
        runs-on: ubuntu-latest
        steps:
            - name: Disable SSL verification for internal Gitea repo
              run: |
                git config --global http."https://gitea.homelab.com/".sslVerify false
            - name: Check out the repository
              uses: actions/checkout@v4
            - name: Set up .NET
              uses: actions/setup-dotnet@v1
              with:
                dotnet-version: "8.0.x"
            - name: Run linters
              uses: wearerequired/lint-action@v2
              with:
                auto_fix: true
                dotnet_format: true
                dotnet_format_auto_fix: true

    run-tests:
        runs-on: ubuntu-latest
        steps:
            - name: Disable SSL verification for internal repo
              run: |
                git config --global http."https://gitea.homelab.com/".sslVerify false
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up .NET
              uses: actions/setup-dotnet@v1
              with:
                dotnet-version: "8.0.x"
            - name: Run tests
              run: dotnet test

    build:
        runs-on: ubuntu-latest
        needs: [run-linters, run-tests]
        steps:
            - name: Disable SSL verification for internal Gitea repo
              run: |
                git config --global http."https://gitea.homelab.com/".sslVerify false
            - name: Check out the repository
              uses: actions/checkout@v4
            - name: Set up .NET
              uses: actions/setup-dotnet@v1
              with:
                dotnet-version: "8.0.x"
            - name: Build solution
              run: dotnet build