name: Build solution

on:
    push:
        branches:
            - master
            - dev

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Disable SSL verification for internal Gitea repo
              run: |
                git config --global http."https://gitea.homelab.com/".sslVerify false
            - name: Check out the repository
              uses: actions/checkout@v4
            - name: Set up .NET
              uses: actions/setup-dotnet@v1
              with:
                dotnet-version: "8.0.x"
            - name: Build solution
              run: dotnet build