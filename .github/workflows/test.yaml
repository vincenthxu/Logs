name: Run tests

on:
    push:
        branches:
            - master
            - dev

jobs:
    run-tests:
        name: Run tests
        runs-on: ubuntu-latest

        steps:
            - name: Disable SSL verification for internal repo
              run: |
                git config --global http."https://gitea.homelab.com/".sslVerify false
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up .NET
              uses: actions/setup-dotnet@v1
              with:
                dotnet-version: "8.0.x"
            - name: Run tests
              uses: dotnet test